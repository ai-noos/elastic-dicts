<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
    <!-- Background -->
    <rect width="800" height="400" fill="#f8f9fa"/>
    
    <!-- Main Tree Structure -->
    <g transform="translate(400, 200)">
        <!-- Root Node -->
        <circle cx="0" cy="0" r="30" fill="#4CAF50" opacity="0.9"/>
        <text x="0" y="6" text-anchor="middle" fill="white" font-family="Arial" font-size="14">Root</text>
        
        <!-- Branch 1 -->
        <path d="M 25,15 L 120,-40" stroke="#666" stroke-width="2"/>
        <circle cx="140" cy="-50" r="25" fill="#FF9800" opacity="0.8"/>
        <text x="140" y="-47" text-anchor="middle" fill="white" font-family="Arial" font-size="12">Category</text>
        
        <!-- Branch 2 -->
        <path d="M 25,0 L 120,40" stroke="#666" stroke-width="2"/>
        <circle cx="140" cy="50" r="25" fill="#FF9800" opacity="0.8"/>
        <text x="140" y="53" text-anchor="middle" fill="white" font-family="Arial" font-size="12">Category</text>
        
        <!-- Sub-items Branch 1 -->
        <path d="M 160,-60 L 220,-90" stroke="#666" stroke-width="2"/>
        <rect x="220" y="-105" width="40" height="30" rx="5" fill="#2196F3" opacity="0.8"/>
        <text x="240" y="-87" text-anchor="middle" fill="white" font-family="Arial" font-size="10">Item</text>
        
        <path d="M 160,-40 L 220,-20" stroke="#666" stroke-width="2"/>
        <rect x="220" y="-35" width="40" height="30" rx="5" fill="#2196F3" opacity="0.8"/>
        <text x="240" y="-17" text-anchor="middle" fill="white" font-family="Arial" font-size="10">Item</text>
        
        <!-- Sub-items Branch 2 -->
        <path d="M 160,40 L 220,20" stroke="#666" stroke-width="2"/>
        <rect x="220" y="5" width="40" height="30" rx="5" fill="#2196F3" opacity="0.8"/>
        <text x="240" y="23" text-anchor="middle" fill="white" font-family="Arial" font-size="10">Item</text>
        
        <path d="M 160,60 L 220,90" stroke="#666" stroke-width="2"/>
        <rect x="220" y="75" width="40" height="30" rx="5" fill="#2196F3" opacity="0.8"/>
        <text x="240" y="93" text-anchor="middle" fill="white" font-family="Arial" font-size="10">Item</text>
    </g>
    
    <!-- Title -->
    <text x="400" y="350" text-anchor="middle" fill="#333" font-family="Arial" font-weight="bold" font-size="24">Elastic Dictionary</text>
    <text x="400" y="380" text-anchor="middle" fill="#666" font-family="Arial" font-size="16">Semantic Tree Structure</text>
</svg> 